services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ${STORAGE_PATH:-./storage}:/app/storage
      - ${ASSETS_PATH:-./assets}:/app/assets:ro
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://ollama:11434
      - TRANSCRIPT_MODEL=${TRANSCRIPT_MODEL:-qwen2.5:1.5b}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000

  # One CPU worker; do not scale this service on this laptop.
  worker:
    build: ./backend
    init: true
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app
      - ${STORAGE_PATH:-./storage}:/app/storage
      - ${ASSETS_PATH:-./assets}:/app/assets:ro
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=2
    command: python -m app.worker

  # Optional CPU-only model server. Not started by normal compose up.
  ollama:
    image: ollama/ollama:0.6.8
    profiles: [ai, setup]
    volumes:
      - ${MODELS_PATH:-./models}/ollama:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 30

  model-download:
    image: ollama/ollama:0.6.8
    profiles: [setup]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ollama, pull]
    command: ["${TRANSCRIPT_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy

  asset-download:
    image: python:3.11-slim
    profiles: [setup]
    working_dir: /setup
    volumes:
      - ./setup:/setup:ro
      - ${ASSETS_PATH:-./assets}:/assets
    entrypoint: [python, -u, download_assets.py]
    command: [voices]
